<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Document Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f7fb;
      --card: rgba(255, 255, 255, 0.92);
      --text: #172033;
      --muted: #687386;
      --border: #e5e9f2;
      --primary: #315bea;
      --primary-dark: #2346c4;
      --soft: #eef2ff;
      --shadow: 0 15px 40px rgba(30, 45, 80, 0.08);
      --danger: #d9304f;
    }

    body.dark {
      --bg: #0e1422;
      --card: rgba(24, 31, 48, 0.95);
      --text: #f4f7ff;
      --muted: #a7b0c3;
      --border: #2b3449;
      --primary: #6684ff;
      --primary-dark: #7d96ff;
      --soft: #1d2740;
      --shadow: 0 15px 40px rgba(0, 0, 0, 0.28);
      --danger: #ff6680;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(49, 91, 234, 0.12), transparent 30%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      width: min(1050px, 92%);
      margin: auto;
    }

    /* HEADER */

    header {
      padding: 28px 0 10px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .profile {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: linear-gradient(135deg, #315bea, #7c5cff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 8px 22px rgba(49, 91, 234, 0.25);
    }

    .profile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand h1 {
      font-size: 25px;
      line-height: 1.2;
      letter-spacing: -0.4px;
    }

    .brand p {
      margin-top: 5px;
      color: var(--muted);
      font-size: 14px;
    }

    .theme-button {
      width: 45px;
      height: 45px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 50%;
      cursor: pointer;
      font-size: 19px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease;
    }

    .theme-button:hover {
      transform: translateY(-2px);
    }

    /* SECURITY BADGE */

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 25px;
      padding: 8px 13px;
      border-radius: 30px;
      background: var(--soft);
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
    }

    /* MAIN */

    main {
      padding: 35px 0 50px;
    }

    .section-heading {
      margin-bottom: 22px;
    }

    .section-heading h2 {
      font-size: 21px;
      margin-bottom: 6px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 14px;
    }

    .document-count {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    /* DOCUMENT GRID */

    .documents {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .document-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .document-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 45px rgba(30, 45, 80, 0.13);
    }

    .document-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
    }

    .document-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
    }

    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
    }

    .pdf-badge {
      background: #fff0f2;
      color: #d9304f;
    }

    .protected-badge {
      background: var(--soft);
      color: var(--primary);
    }

    .document-card h3 {
      font-size: 18px;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    .document-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      min-height: 42px;
    }

    .view-button {
      width: 100%;
      margin-top: 20px;
      padding: 13px 16px;
      border: none;
      border-radius: 13px;
      background: var(--primary);
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .view-button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding: 20px 0 30px;
      color: var(--muted);
      font-size: 12px;
    }

    /* MODAL */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 12, 25, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: min(390px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 27px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
      animation: popup 0.22s ease;
    }

    @keyframes popup {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .lock-icon {
      width: 55px;
      height: 55px;
      border-radius: 17px;
      background: var(--soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      margin-bottom: 17px;
    }

    .modal h2 {
      font-size: 21px;
      margin-bottom: 7px;
    }

    .modal-description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .pin-input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      outline: none;
      background: var(--bg);
      color: var(--text);
      font-size: 18px;
      text-align: center;
      letter-spacing: 5px;
    }

    .pin-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(49, 91, 234, 0.12);
    }

    .pin-input:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .error-message {
      min-height: 20px;
      margin-top: 9px;
      color: var(--danger);
      font-size: 12px;
      text-align: center;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .continue-button,
    .cancel-button {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }

    .continue-button {
      border: none;
      background: var(--primary);
      color: white;
    }

    .continue-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .cancel-button {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
    }

    .lockout-message {
      margin-top: 13px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(217, 48, 79, 0.1);
      color: var(--danger);
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
      display: none;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .container {
        width: 90%;
      }

      header {
        padding-top: 22px;
      }

      .profile {
        width: 50px;
        height: 50px;
      }

      .brand h1 {
        font-size: 21px;
      }

      .brand p {
        font-size: 12px;
      }

      .documents {
        grid-template-columns: 1fr;
      }

      .document-card {
        padding: 19px;
      }

      .document-card h3 {
        font-size: 17px;
      }

      .modal {
        padding: 23px;
      }
    }
  </style>
</head>
